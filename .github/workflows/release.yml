name: Release

# Se dispara cuando pusheás un tag que empiece con "v" (ej. v0.5.0, v1.0.0).
# Crea automáticamente una GitHub Release con el .zip de la extensión
# adjunto — los clientes bajan el zip desde
# https://github.com/<user>/<repo>/releases/latest
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necesario para crear releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run generate:icons

      - name: Run tests
        run: npm run test:run

      - name: Typecheck
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Package zip
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p releases
          cd dist
          zip -r "../releases/digitalsellers-hub-v${VERSION}.zip" .
          cd ..
          echo "ZIP_PATH=releases/digitalsellers-hub-v${VERSION}.zip" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extrae la sección de CHANGELOG entre "## [VERSION]" y el próximo "## ["
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v ver="${{ env.VERSION }}" '
              /^## \[/ && $0 ~ ver { found=1; next }
              /^## \[/ && found { exit }
              found { print }
            ' CHANGELOG.md)
            # Guardamos las notas en un archivo para el body del release
            echo "$NOTES" > release-notes.md
          else
            echo "Sin changelog disponible." > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DigitalSellers Hub v${{ env.VERSION }}"
          body_path: release-notes.md
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
